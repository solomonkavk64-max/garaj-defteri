<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarajDefteri</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { background: #27ae60; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; }
        .btn-secondary:hover { background: #1c5980; }
        .btn-inspection { background: #8e44ad; }
        .btn-inspection:hover { background: #732d91; }
        .btn-km { background: #d35400; }
        .btn-km:hover { background: #ba4a00; }
        .btn-danger { background: #c0392b; padding: 6px 12px; font-size: 14px; width: auto; margin-top: 10px; }
        .btn-danger:hover { background: #962d22; }
        .btn-calendar { background: #e67e22; padding: 6px 12px; font-size: 14px; width: auto; margin-top: 10px; text-decoration: none; display: inline-block; color: white; border-radius: 5px; font-weight: bold; }
        .btn-calendar:hover { background: #d35400; }
        .summary-box { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .summary-box h3 { color: #f1c40f; margin-top: 0; }
        .alert-box { background: #e74c3c; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .date-filter-row { display: flex; gap: 10px; margin-top: 10px; }
        .date-filter-row input { margin-bottom: 0; background: white; color: #333; font-size: 14px; padding: 6px; }
        .vehicle-card, .log-card, .inspection-card { background: #ecf0f1; padding: 15px; margin-top: 10px; border-radius: 5px; border-left: 5px solid #2980b9; position: relative; }
        .log-card { border-left-color: #e67e22; }
        .inspection-card { border-left-color: #8e44ad; }
        .receipt-img { max-width: 100%; border-radius: 5px; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 GarajDefteri</h2>
    
    <!-- UYARI / HATIRLATICI KUTUSU -->
    <div id="alert-container" class="alert-box"></div>

    <!-- TOPLAM MASRAF ÖZETİ VE TARİH FİLTRESİ -->
    <div class="summary-box">
        <h3>💰 Maliyet Özeti</h3>
        <p id="total-cost-display">Toplam Masraf: Yükleniyor...</p>
        
        <div class="date-filter-row">
            <div style="flex:1;">
                <label style="font-size: 11px; text-align: left; margin-bottom: 2px; color: #ecf0f1;">Başlangıç:</label>
                <input type="date" id="filter_start_date" onchange="calculateTotalCost()">
            </div>
            <div style="flex:1;">
                <label style="font-size: 11px; text-align: left; margin-bottom: 2px; color: #ecf0f1;">Bitiş:</label>
                <input type="date" id="filter_end_date" onchange="calculateTotalCost()">
            </div>
        </div>
        <button onclick="resetDateFilter()" style="background: #e74c3c; margin-top: 8px; padding: 6px; font-size: 13px;">Tüm Zamanları Göster</button>
    </div>

    <!-- ARAÇ EKLEME FORMU -->
    <div class="form-group">
        <h3>Yeni Araç Ekle</h3>
        <input type="text" id="brand" placeholder="Marka (Örn: Lada)">
        <input type="text" id="model" placeholder="Model (Örn: Samara)">
        <input type="number" id="year" placeholder="Yıl (Örn: 1990)">
        <input type="number" id="current_km" placeholder="Güncel Kilometre (Örn: 145000)">
        <input type="text" id="plate" placeholder="Plaka (Örn: 03AB123)">
        <button onclick="addVehicle()">Aracı Kaydet</button>
    </div>

    <!-- KİLOMETRE GÜNCELLEME FORMU -->
    <div class="form-group">
        <h3>📊 KM Güncelle</h3>
        <label for="km_vehicle_select">Araç Seçin:</label>
        <select id="km_vehicle_select">
            <option value="">Araç yükleniyor...</option>
        </select>
        
        <input type="number" id="new_km" placeholder="Yeni Kilometre (Örn: 146200)">
        <button class="btn-km" onclick="updateVehicleKm()">Kilometreyi Güncelle</button>
    </div>

    <!-- BAKIM / MASRAF EKLEME FORMU -->
    <div class="form-group">
        <h3>🔧 Bakım / Rutin Servis Ekle</h3>
        <label for="vehicle_select">Araç Seçin:</label>
        <select id="vehicle_select">
            <option value="">Araç yükleniyor...</option>
        </select>
        
        <input type="text" id="title" placeholder="İşlem Tanımı (Örn: Yıllık Yağ Değişimi, Balata)">
        <input type="number" id="cost" placeholder="Tutar (TL) (Örn: 1500)">
        <input type="number" id="log_km" placeholder="İşlem Anındaki KM (Örn: 145500)">
        <input type="date" id="log_date">
        
        <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
        <label style="font-size:13px; color:#c0392b;">Sonraki Bakım Hatırlatıcısı (İsteğe Bağlı):</label>
        <input type="number" id="next_km" placeholder="Sonraki Bakım KM (Örn: 155000)">
        <input type="date" id="next_date">
        
        <label for="receipt_file">Fiş / Fatura Fotoğrafı:</label>
        <input type="file" id="receipt_file" accept="image/*">
        
        <button class="btn-secondary" onclick="addMaintenanceLog()">Bakım Kaydını Ekle</button>
    </div>

    <!-- TÜVTÜRK MUAYENE EKLEME FORMU -->
    <div class="form-group">
        <h3>🔍 TÜVTÜRK Muayene Kaydı Ekle</h3>
        <label for="inspection_vehicle_select">Araç Seçin:</label>
        <select id="inspection_vehicle_select">
            <option value="">Araç yükleniyor...</option>
        </select>
        
        <label>Muayene Tarihi:</label>
        <input type="date" id="insp_date">
        
        <label>Sonraki Muayene Geçerlilik Tarihi:</label>
        <input type="date" id="insp_expiry">
        
        <input type="number" id="insp_cost" placeholder="Muayene Ücreti (TL) (İsteğe bağlı)">
        
        <label for="report_file">Muayene Raporu / Belge:</label>
        <input type="file" id="report_file" accept="image/*,.pdf">
        
        <button class="btn-inspection" onclick="addInspectionLog()">Muayene Kaydını Ekle</button>
    </div>

    <hr style="margin: 30px 0;">

    <!-- LİSTELER -->
    <h3>Garajdaki Araçlarım</h3>
    <div id="vehicle-list">Yükleniyor...</div>

    <h3 style="margin-top: 30px;">🔍 Muayene Geçmişi</h3>
    <div id="inspection-list">Yükleniyor...</div>

    <h3 style="margin-top: 30px;">Son Bakım / Servis Kayıtları</h3>
    <div id="log-list">Yükleniyor...</div>
</div>

<script type="module">
    import { supabase } from './supabase.js'

    let globalVehicles = []
    let globalMaintenance = []
    let globalInspections = []

    // UYARI VE HATIRLATICI KONTROLÜ (Muayene + Bakım)
    function checkReminders() {
        const alertBox = document.getElementById('alert-container')
        const today = new Date()
        let warningText = ""
        let hasWarning = false

        // 1. Muayene Kontrolleri
        globalInspections.forEach(insp => {
            if (insp.expiry_date) {
                const expiryDate = new Date(insp.expiry_date)
                const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24))
                const vehicleName = insp.vehicles ? `${insp.vehicles.brand} ${insp.vehicles.model}` : 'Araç'

                if (diffDays <= 30 && diffDays >= 0) {
                    hasWarning = true
                    warningText += `⚠️ <strong>${vehicleName}</strong> muayenesine <strong>${diffDays} gün</strong> kaldı!<br>`
                } else if (diffDays < 0) {
                    hasWarning = true
                    warningText += `🚨 <strong>${vehicleName}</strong> muayene süresi <strong>GEÇMİŞ!</strong><br>`
                }
            }
        })

        // 2. Bakım Tarihi ve KM Kontrolleri
        globalMaintenance.forEach(log => {
            const vehicle = globalVehicles.find(v => v.id === log.vehicle_id)
            const vehicleName = log.vehicles ? `${log.vehicles.brand} ${log.vehicles.model}` : 'Araç'

            // Tarih bazlı kontrol
            if (log.next_date) {
                const nextDate = new Date(log.next_date)
                const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24))
                if (diffDays <= 15 && diffDays >= 0) {
                    hasWarning = true
                    warningText += `🔧 <strong>${vehicleName}</strong> (${log.title}) bakım tarihine <strong>${diffDays} gün</strong> kaldı!<br>`
                } else if (diffDays < 0) {
                    hasWarning = true
                    warningText += `🔧 <strong>${vehicleName}</strong> (${log.title}) bakım tarihi <strong>geldi/geçti!</strong><br>`
                }
            }

            // KM bazlı kontrol
            if (log.next_km && vehicle && vehicle.current_km) {
                const kmDiff = log.next_km - vehicle.current_km
                if (kmDiff <= 1000 && kmDiff >= 0) {
                    hasWarning = true
                    warningText += `📊 <strong>${vehicleName}</strong> bakım kilometresine <strong>${kmDiff} KM</strong> kaldı! (Hedef: ${log.next_km} KM)<br>`
                } else if (kmDiff < 0) {
                    hasWarning = true
                    warningText += `📊 <strong>${vehicleName}</strong> bakım kilometresini <strong>${Math.abs(kmDiff)} KM</strong> aştınız!<br>`
                }
            }
        })

        if (hasWarning) {
            alertBox.innerHTML = warningText
            alertBox.style.display = "block"
        } else {
            alertBox.style.display = "none"
        }
    }

    function getGoogleCalendarUrl(title, dateStr, details) {
        const dateFormatted = dateStr.replace(/-/g, '')
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dateFormatted}/${dateFormatted}&details=${encodeURIComponent(details)}`
    }

    window.calculateTotalCost = function() {
        const costDisplay = document.getElementById('total-cost-display')
        const startDateVal = document.getElementById('filter_start_date').value
        const endDateVal = document.getElementById('filter_end_date').value

        const startDate = startDateVal ? new Date(startDateVal) : null
        const endDate = endDateVal ? new Date(endDateVal) : null

        if (startDate) startDate.setHours(0, 0, 0, 0)
        if (endDate) endDate.setHours(23, 59, 59, 999)

        let totalMaint = 0
        globalMaintenance.forEach(item => {
            const itemDate = item.date ? new Date(item.date) : null
            let pass = true
            if (startDate && itemDate && itemDate < startDate) pass = false
            if (endDate && itemDate && itemDate > endDate) pass = false
            if (pass) totalMaint += parseFloat(item.cost) || 0
        })

        let totalInsp = 0
        globalInspections.forEach(item => {
            const itemDate = item.inspection_date ? new Date(item.inspection_date) : null
            let pass = true
            if (startDate && itemDate && itemDate < startDate) pass = false
            if (endDate && itemDate && itemDate > endDate) pass = false
            if (pass) totalInsp += parseFloat(item.cost) || 0
        })

        const grandTotal = totalMaint + totalInsp
        let infoText = "Tüm Zamanlar"
        if (startDateVal && endDateVal) infoText = `${startDateVal} - ${endDateVal}`

        costDisplay.innerHTML = `Harcama (${infoText}): <strong>${grandTotal.toLocaleString('tr-TR')} TL</strong><br>
            <span style="font-size: 13px; color: #bdc3c7;">(Bakım: ${totalMaint.toLocaleString('tr-TR')} TL | Muayene: ${totalInsp.toLocaleString('tr-TR')} TL)</span>`
    }

    window.resetDateFilter = function() {
        document.getElementById('filter_start_date').value = ''
        document.getElementById('filter_end_date').value = ''
        calculateTotalCost()
    }

    async function fetchVehicles() {
        const listDiv = document.getElementById('vehicle-list')
        const selectBox = document.getElementById('vehicle_select')
        const inspSelectBox = document.getElementById('inspection_vehicle_select')
        const kmSelectBox = document.getElementById('km_vehicle_select')
        
        const { data, error } = await supabase.from('vehicles').select('*').order('created_at', { ascending: false })

        if (error) { listDiv.innerHTML = 'Hata: ' + error.message; return; }

        globalVehicles = data || []
        selectBox.innerHTML = '<option value="">Araç Seçiniz</option>'
        inspSelectBox.innerHTML = '<option value="">Araç Seçiniz</option>'
        kmSelectBox.innerHTML = '<option value="">Araç Seçiniz</option>'

        if (globalVehicles.length === 0) { listDiv.innerHTML = 'Henüz eklenmiş araç yok.'; return; }

        listDiv.innerHTML = ''
        globalVehicles.forEach(vehicle => {
            listDiv.innerHTML += `
                <div class="vehicle-card">
                    <strong>${vehicle.brand} ${vehicle.model} (${vehicle.year || 'Yıl yok'})</strong><br>
                    Plaka: ${vehicle.plate || 'Belirtilmemiş'} | KM: ${vehicle.current_km}<br>
                    <button class="btn-danger" onclick="deleteVehicle('${vehicle.id}')">Aracı Sil</button>
                </div>
            `
            const optHtml = `<option value="${vehicle.id}">${vehicle.brand} ${vehicle.model} (${vehicle.plate || 'Plakasız'})</option>`
            selectBox.innerHTML += optHtml
            inspSelectBox.innerHTML += optHtml
            kmSelectBox.innerHTML += optHtml
        })
        checkReminders()
    }

    async function fetchLogs() {
        const logDiv = document.getElementById('log-list')
        const { data, error } = await supabase.from('maintenance_logs').select('*, vehicles(brand, model)').order('date', { ascending: false })

        if (error) { logDiv.innerHTML = 'Bakımlar yüklenemedi: ' + error.message; return; }

        globalMaintenance = data || []
        checkReminders()

        if (globalMaintenance.length === 0) { logDiv.innerHTML = 'Henüz bakım kaydı yok.'; calculateTotalCost(); return; }

        logDiv.innerHTML = ''
        globalMaintenance.forEach(log => {
            const vehicleInfo = log.vehicles ? `${log.vehicles.brand} ${log.vehicles.model}` : 'Araç'
            const imgHtml = log.receipt_url ? `<br><img src="${log.receipt_url}" class="receipt-img">` : ''
            const nextInfo = (log.next_km || log.next_date) ? `<br><span style="color:#c0392b; font-size:13px;">Sonraki Bakım: ${log.next_km ? log.next_km + ' KM' : ''} ${log.next_date ? '(' + log.next_date + ')' : ''}</span>` : ''
            
            let calBtn = ''
            if (log.next_date) {
                const calUrl = getGoogleCalendarUrl(`🔧 Periyodik Bakım Hatırlatıcı (${vehicleInfo})`, log.next_date, `GarajDefteri: ${vehicleInfo} aracınızın ${log.title} bakım zamanı geldi!`)
                calBtn = `<br><a href="${calUrl}" target="_blank" class="btn-calendar">📅 Bakımı Takvime Ekle</a>`
            }

            logDiv.innerHTML += `
                <div class="log-card">
                    <strong>${vehicleInfo} - ${log.title}</strong><br>
                    Tutar: ${log.cost} TL | İşlem KM: ${log.km || '-'}<br>
                    Tarih: ${log.date || '-'}${nextInfo}${imgHtml}${calBtn}
                    <br><button class="btn-danger" onclick="deleteLog('${log.id}')">Bakım Kaydını Sil</button>
                </div>
            `
        })
        calculateTotalCost()
    }

    async function fetchInspections() {
        const inspDiv = document.getElementById('inspection-list')
        const { data, error } = await supabase.from('inspection_logs').select('*, vehicles(brand, model)').order('expiry_date', { ascending: true })

        if (error) { inspDiv.innerHTML = 'Muayeneler yüklenemedi: ' + error.message; return; }

        globalInspections = data || []
        checkReminders()

        if (globalInspections.length === 0) { inspDiv.innerHTML = 'Henüz muayene kaydı yok.'; calculateTotalCost(); return; }

        inspDiv.innerHTML = ''
        globalInspections.forEach(insp => {
            const vehicleInfo = insp.vehicles ? `${insp.vehicles.brand} ${insp.vehicles.model}` : 'Araç'
            const costInfo = insp.cost ? ` | Ücret: ${insp.cost} TL` : ''
            const reportHtml = insp.report_url ? `<br><a href="${insp.report_url}" target="_blank">📄 Muayene Raporunu Görüntüle</a>` : ''
            const calUrl = getGoogleCalendarUrl(`🚗 Araç Muayene Bitişi (${vehicleInfo})`, insp.expiry_date, `GarajDefteri: ${vehicleInfo} muayene süresi sona eriyor!`)

            inspDiv.innerHTML += `
                <div class="inspection-card">
                    <strong>${vehicleInfo} - Muayene Kaydı</strong>${costInfo}<br>
                    Muayene Tarihi: ${insp.inspection_date} | <strong>Son Geçerlilik: ${insp.expiry_date}</strong>${reportHtml}<br>
                    <a href="${calUrl}" target="_blank" class="btn-calendar">📅 Takvime Ekle / Hatırlatıcı Kur</a>
                    <br><button class="btn-danger" onclick="deleteInspection('${insp.id}')">Muayene Kaydını Sil</button>
                </div>
            `
        })
        calculateTotalCost()
    }

    window.addVehicle = async function() {
        const brand = document.getElementById('brand').value
        const model = document.getElementById('model').value
        const year = document.getElementById('year').value
        const current_km = document.getElementById('current_km').value
        const plate = document.getElementById('plate').value

        if (!brand || !model || !current_km) { alert('Lütfen marka, model ve kilometre alanlarını doldurun!'); return; }

        const { error } = await supabase.from('vehicles').insert([{ brand, model, year: year ? parseInt(year) : null, current_km: parseInt(current_km), plate }])
        if (error) alert('Kayıt başarısız: ' + error.message);
        else { alert('Araç eklendi!'); document.getElementById('brand').value = ''; document.getElementById('model').value = ''; document.getElementById('year').value = ''; document.getElementById('current_km').value = ''; document.getElementById('plate').value = ''; fetchVehicles(); }
    }

    window.updateVehicleKm = async function() {
        const vehicle_id = document.getElementById('km_vehicle_select').value
        const new_km = document.getElementById('new_km').value
        if (!vehicle_id || !new_km) { alert('Lütfen araç seçin ve yeni kilometreyi girin!'); return; }

        const { error } = await supabase.from('vehicles').update({ current_km: parseInt(new_km) }).eq('id', vehicle_id)
        if (error) alert('Kilometre güncellenemedi: ' + error.message);
        else { alert('Kilometre güncellendi!'); document.getElementById('new_km').value = ''; fetchVehicles(); fetchLogs(); }
    }

    window.addMaintenanceLog = async function() {
        const vehicle_id = document.getElementById('vehicle_select').value
        const title = document.getElementById('title').value
        const cost = document.getElementById('cost').value
        const km = document.getElementById('log_km').value
        const date = document.getElementById('log_date').value
        const next_km = document.getElementById('next_km').value
        const next_date = document.getElementById('next_date').value
        const fileInput = document.getElementById('receipt_file')

        if (!vehicle_id || !title || !cost) { alert('Lütfen araç, işlem tanımı ve tutar alanlarını doldurun!'); return; }

        let receipt_url = null
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0]
            const fileName = `${Date.now()}_${file.name}`
            const { error: uploadError } = await supabase.storage.from('receipts').upload(fileName, file)
            if (uploadError) { alert('Fiş yüklenirken hata: ' + uploadError.message); return; }
            const { data: publicUrlData } = await supabase.storage.from('receipts').getPublicUrl(fileName)
            receipt_url = publicUrlData.publicUrl
        }

        const { error } = await supabase.from('maintenance_logs').insert([{ 
            vehicle_id, 
            title, 
            cost: parseFloat(cost), 
            km: km ? parseInt(km) : null, 
            date: date || null, 
            next_km: next_km ? parseInt(next_km) : null,
            next_date: next_date || null,
            receipt_url 
        }])

        if (error) alert('Bakım kaydı başarısız: ' + error.message);
        else { 
            alert('Bakım kaydı başarıyla eklendi!'); 
            document.getElementById('title').value = ''; 
            document.getElementById('cost').value = ''; 
            document.getElementById('log_km').value = ''; 
            document.getElementById('next_km').value = ''; 
            document.getElementById('next_date').value = ''; 
            document.getElementById('receipt_file').value = ''; 
            fetchLogs(); 
        }
    }

    window.addInspectionLog = async function() {
        const vehicle_id = document.getElementById('inspection_vehicle_select').value
        const inspection_date = document.getElementById('insp_date').value
        const expiry_date = document.getElementById('insp_expiry').value
        const cost = document.getElementById('insp_cost').value
        const fileInput = document.getElementById('report_file')

        if (!vehicle_id || !inspection_date || !expiry_date) { alert('Lütfen araç, muayene tarihi ve sonraki geçerlilik tarihini doldurun!'); return; }

        let report_url = null
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0]
            const fileName = `insp_${Date.now()}_${file.name}`
            const { error: uploadError } = await supabase.storage.from('receipts').upload(fileName, file)
            if (uploadError) { alert('Rapor yüklenirken hata: ' + uploadError.message); return; }
            const { data: publicUrlData } = await supabase.storage.from('receipts').getPublicUrl(fileName)
            report_url = publicUrlData.publicUrl
        }

        const { error } = await supabase.from('inspection_logs').insert([{ vehicle_id, inspection_date, expiry_date, cost: cost ? parseFloat(cost) : null, report_url }])
        if (error) alert('Muayene kaydı başarısız: ' + error.message);
        else { alert('Muayene kaydı eklendi!'); document.getElementById('insp_date').value = ''; document.getElementById('insp_expiry').value = ''; document.getElementById('insp_cost').value = ''; document.getElementById('report_file').value = ''; fetchInspections(); }
    }

    window.deleteVehicle = async function(id) {
        if (confirm('Aracı silmek istediğinize emin misiniz?')) {
            const { error } = await supabase.from('vehicles').delete().eq('id', id)
            if (error) alert('Silme hatası: ' + error.message); else { fetchVehicles(); fetchLogs(); fetchInspections(); }
        }
    }

    window.deleteLog = async function(id) {
        if (confirm('Bakım kaydını silmek istediğinize emin misiniz?')) {
            const { error } = await supabase.from('maintenance_logs').delete().eq('id', id)
            if (error) alert('Silme hatası: ' + error.message); else fetchLogs();
        }
    }

    window.deleteInspection = async function(id) {
        if (confirm('Muayene kaydını silmek istediğinize emin misiniz?')) {
            const { error } = await supabase.from('inspection_logs').delete().eq('id', id)
            if (error) alert('Silme hatası: ' + error.message); else fetchInspections();
        }
    }

    document.getElementById('log_date').valueAsDate = new Date()
    document.getElementById('insp_date').valueAsDate = new Date()

    fetchVehicles()
    fetchLogs()
    fetchInspections()
</script>

</body>
</html>
